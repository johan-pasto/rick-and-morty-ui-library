<section
  class="overflow-hidden rounded-xl bg-[#252A34] text-white transition-shadow duration-200"
  [class]="elevationClasses[elevation()]"
>
  <header class="border-b border-[#97CE4C]/30">
    <button
      type="button"
      class="flex w-full flex-col items-start gap-1 p-4 text-left transition-colors hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[#97CE4C]"
      (click)="handleHeaderClick()"
    >
      <span class="text-lg font-bold text-[#97CE4C]">
        {{ title() }}
      </span>

      @if (subtitle()) {
        <span class="text-sm text-gray-300">
          {{ subtitle() }}
        </span>
      }
    </button>
  </header>

  <div class="p-4">
    <ng-content></ng-content>
  </div>
</section>
